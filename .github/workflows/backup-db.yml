name: Respaldo de base de datos

# Fase 0, paso 6 del Plan de Acción: Escalabilidad de Reúso.
#
# Respalda los DATOS mediante la API de Supabase, no con pg_dump. Motivo: la
# conexión directa de Supabase resuelve solo a IPv6 y los runners de GitHub
# no lo soportan, mientras que el pooler impone restricciones que hacen
# fallar el volcado. La API usa la misma llave de servicio que ya usa la
# aplicación, así que no depende de la red de Postgres ni de la versión del
# cliente.
#
# El ESQUEMA no se incluye a propósito: vive versionado en `sql/` dentro de
# este mismo repositorio. Entre las dos piezas, la base se puede reconstruir
# por completo.
#
# Dos bóvedas, ambas en el plan gratuito:
#   1. Artefacto de GitHub (90 días).
#   2. Cloudflare R2 (opcional; si faltan las llaves, no falla).

on:
  schedule:
    # 08:00 UTC = 3:00 a.m. en Colombia (UTC-5).
    - cron: '0 8 * * *'
  workflow_dispatch:
  # Al cambiar el respaldo, se prueba solo. Sin esto, la única forma de estrenar
  # una corrección es el botón "Run workflow": el de "Re-run jobs" repite el
  # commit viejo en vez del nuevo, así que una corrección ya subida parece
  # seguir fallando (confusión real que costó cuatro intentos).
  push:
    branches: [main]
    paths:
      - '.github/workflows/backup-db.yml'
      - 'scripts/respaldo-datos.mjs'

jobs:
  respaldo:
    name: Volcado, cifrado y envío a las dos bóvedas
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar que existen las llaves de Supabase
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          FALTA=0
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "::error::Falta el secreto NEXT_PUBLIC_SUPABASE_URL."
            FALTA=1
          fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Falta el secreto SUPABASE_SERVICE_ROLE_KEY."
            FALTA=1
          fi
          if [ "$FALTA" -eq 1 ]; then
            echo "Ambos salen de Supabase -> Settings -> API (Project URL y la llave service_role)."
            exit 1
          fi
          echo "Llaves presentes."

      - name: Exportar los datos
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          FECHA=$(date -u +'%Y-%m-%d')
          node scripts/respaldo-datos.mjs .
          gzip -9 "reuso-datos-$FECHA.json"
          echo "ARCHIVO=reuso-datos-$FECHA.json.gz" >> "$GITHUB_ENV"
          ls -lh "reuso-datos-$FECHA.json.gz"

      - name: Comprobar que el respaldo no salió vacío
        run: |
          set -euo pipefail
          TAM=$(stat -c%s "$ARCHIVO")
          echo "Tamaño: $TAM bytes"
          # Un respaldo real de este proyecto pesa muy por encima de 1 KB.
          # Guardar uno vacío en silencio sería peor que no tener respaldo,
          # porque da falsa sensación de seguridad hasta el día de restaurar.
          if [ "$TAM" -lt 1024 ]; then
            echo "::error::El respaldo pesa $TAM bytes, demasiado poco. Se aborta."
            exit 1
          fi
          echo "Respaldo verificado."

      - name: Cifrar el respaldo (AES-256)
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Falta el secreto BACKUP_PASSPHRASE. No se guarda un respaldo sin cifrar."
            exit 1
          fi
          gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase "$BACKUP_PASSPHRASE" \
            --output "$ARCHIVO.gpg" "$ARCHIVO"
          rm -f "$ARCHIVO"          # el archivo en claro nunca sigue viaje
          ls -lh "$ARCHIVO.gpg"

      - name: Bóveda 1 — artefacto de GitHub (90 días)
        uses: actions/upload-artifact@v4
        with:
          name: respaldo-base-datos
          path: ${{ env.ARCHIVO }}.gpg
          retention-days: 90
          if-no-files-found: error

      - name: Bóveda 2 — Cloudflare R2
        # Si aún no se configuran las llaves de R2, el respaldo NO falla: la
        # bóveda 1 ya quedó guardada y este paso solo avisa.
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$R2_BUCKET" ]; then
            echo "::warning::Faltan las llaves de Cloudflare R2. El respaldo quedó guardado solo en la bóveda de GitHub."
            exit 0
          fi
          aws s3 cp "$ARCHIVO.gpg" "s3://$R2_BUCKET/$ARCHIVO.gpg" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --checksum-algorithm CRC32
          echo "Copia enviada a Cloudflare R2."

      - name: Resumen
        if: always()
        run: |
          {
            echo "### Respaldo de base de datos"
            echo ""
            echo "- Archivo: \`$ARCHIVO.gpg\` (cifrado AES-256)"
            echo "- Contiene: los datos de todas las tablas"
            echo "- El esquema vive en \`sql/\` dentro de este repositorio"
            echo "- Bóveda 1: artefacto de GitHub, 90 días"
            echo "- Bóveda 2: Cloudflare R2 (si las llaves están configuradas)"
            echo ""
            echo "Para restaurarlo:"
            echo '`gpg --decrypt archivo.gpg | gunzip > datos.json`'
          } >> "$GITHUB_STEP_SUMMARY"
